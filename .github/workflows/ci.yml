name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pulseledger_test
          POSTGRES_USER: pulseledger
          POSTGRES_PASSWORD: pulseledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulseledger -d pulseledger_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Used by the db:migrate step below, which proves migrations apply cleanly to an empty
      # database. Deliberately NOT exported as TEST_DATABASE_URL: every integration test file
      # owns its own database (see the `withDatabase(...)` name each one declares), and pointing
      # them all at one shared database made them run migrations concurrently and read each
      # other's rows -- deadlocks and cross-file interference, not real defects. With the variable
      # unset, Testcontainers gives each file an isolated PostgreSQL, exactly as it does locally,
      # so CI runs the same suite a developer runs.
      DATABASE_URL: postgresql://pulseledger:pulseledger@localhost:5432/pulseledger_test
      NODE_ENV: test
      LOG_LEVEL: silent
      ADMIN_API_KEY: ci-admin-api-key-0123456789

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run architecture:check
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build
