name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pulseledger_test
          POSTGRES_USER: pulseledger
          POSTGRES_PASSWORD: pulseledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulseledger -d pulseledger_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://pulseledger:pulseledger@localhost:5432/pulseledger_test
      TEST_DATABASE_URL: postgresql://pulseledger:pulseledger@localhost:5432/pulseledger_test
      NODE_ENV: test
      LOG_LEVEL: silent

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run architecture:check
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build
